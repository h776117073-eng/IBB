name: Validate IBB Market
on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "data/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - "scripts/validate.mjs"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate dataset and application syntax
        run: node scripts/validate.mjs
