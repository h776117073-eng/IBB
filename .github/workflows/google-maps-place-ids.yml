name: Ibb Google Maps Place ID index

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/google-maps-place-ids.yml"
      - "scripts/google_maps_place_id_index.py"
      - "data/index.json"
      - "data/store-names-*.json"
  workflow_dispatch:
    inputs:
      source_path:
        description: "Repository-relative CSV path, or auto"
        required: false
        default: "auto"
        type: string
      batch_size:
        description: "Records per run (1-2000)"
        required: false
        default: "1000"
        type: string
      reset:
        description: "Reset progress and start a fresh ID index"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: ibb-google-maps-place-id-index
  cancel-in-progress: false

jobs:
  validate:
    name: Validate code and source data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout IBB repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python script
        run: python -m py_compile scripts/google_maps_place_id_index.py
      - name: Run self-tests and validate source names
        run: python scripts/google_maps_place_id_index.py --self-test --validate-source --source-path auto

  scan:
    name: Resolve Place IDs in resumable batches
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository with write token
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Google Maps API secret
        id: maps-key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$GOOGLE_MAPS_API_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Google Maps API key required"
              echo
              echo "Validation passed. Live Places API requests are waiting for the repository secret GOOGLE_MAPS_API_KEY."
              echo "Add the secret in Settings > Secrets and variables > Actions, enable Places API (New), then run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Live scan skipped: GOOGLE_MAPS_API_KEY is not configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the next search batch
        if: steps.maps-key.outputs.enabled == 'true'
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SOURCE_PATH: ${{ inputs.source_path || 'auto' }}
          BATCH_SIZE: ${{ inputs.batch_size || '1000' }}
          RESET_PROGRESS: ${{ inputs.reset || 'false' }}
        shell: bash
        run: |
          args=(--source-path "$SOURCE_PATH" --batch-size "$BATCH_SIZE")
          if [[ "$RESET_PROGRESS" == "true" ]]; then
            args+=(--reset)
          fi
          python scripts/google_maps_place_id_index.py "${args[@]}"
      - name: Commit Place IDs and resumable cursor
        if: always() && steps.maps-key.outputs.enabled == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/google_maps_place_ids.csv verification/google_maps_place_ids_progress.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new Place IDs or progress changes to commit."
          else
            git commit -m "Update Ibb Google Maps Place ID index"
            git push origin HEAD:main
          fi
      - name: Explain how to enable live lookup
        if: steps.maps-key.outputs.enabled != 'true'
        run: |
          echo "Workflow validation succeeded. Live Google Maps lookups are waiting for GOOGLE_MAPS_API_KEY."
