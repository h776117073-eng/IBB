name: Deploy IBB Market to GitHub Pages
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/store-names-*.json"
      - "data/index.json"
      - "README.md"
      - "ROADMAP.md"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "github-pages"
  cancel-in-progress: false
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Expand and validate reviewed profile package when uploaded
        shell: bash
        run: |
          if [ -f data/verified-profiles-import.zip ]; then
            tmp="$RUNNER_TEMP/ibb-profile-package"
            rm -rf "$tmp"
            mkdir -p "$tmp"
            unzip -q data/verified-profiles-import.zip -d "$tmp"
            test -f "$tmp/data/verified-profiles/index.json"
            mkdir -p data/verified-profiles
            cp -a "$tmp/data/verified-profiles/." data/verified-profiles/
          else
            echo "Verified profile package not uploaded; publishing existing name-only directory."
          fi
      - name: Validate directory and profile data
        run: node scripts/validate.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
