</style></head><body><header><div class="wrap"><h1>مراجعة مساهمات إب ماركت</h1><div>الموافقة تنشر بيانات الدليل فقط ولا تثبت ملكية النشاط.</div></div></header><main class="wrap"><section class="panel"><label for="key">مفتاح الإدارة</label><div class="row"><input id="key" type="password" autocomplete="off"><button id="connect" class="primary">دخول</button></div><p class="muted">لا تحفظ المفتاح في المتصفح أو تشاركه مع الآخرين.</p><div id="status" class="status"></div></section><section id="panel" class="panel hidden"><div class="row"><strong>الطلبات المعلقة</strong><button id="refresh">تحديث</button></div><div id="queue"></div></section><p><a href="./">العودة إلى الدليل</a></p></main><script>
(function(){"use strict";var API="https://ibb-market-api.aicreativestudio.workers.dev",key="",$=function(id){return document.getElementById(id);};function say(s){$("status").textContent=s;}async function call(path,opts){opts=opts||{};var h=Object.assign({"Authorization":"Bearer "+key},opts.headers||{});if(opts.body)h["Content-Type"]="application/json";var r=await fetch(API+path,Object.assign({},opts,{headers:h,cache:"no-store"})),d={};try{d=await r.json();}catch(_){}if(!r.ok)throw new Error(d.message||d.error||("HTTP "+r.status));return d;}function node(p,t,c,s){var n=document.createElement(t);if(c)n.className=c;n.textContent=s||"";p.appendChild(n);return n;}function show(items){$("queue").replaceChildren();items.forEach(function(x){var p=x.payload||{},card=node($("queue"),"article","item","");node(card,"h3","",x.kind==="STORE"?"طلب منشأة":"طلب منتج");node(card,"div","muted",x.id+" · "+new Date(x.created_at).toLocaleString("ar"));var data=x.kind==="STORE"?"الاسم: "+p.name+"\nالنشاط: "+(p.category||"—")+"\nالحي: "+(p.neighborhood||"—")+"\nالوصف: "+(p.description||"—")+"\nالموقع: "+p.latitude+", "+p.longitude+"\nالموافقة لا تثبت الملكية.":"المنتج: "+p.name+"\nالمتجر: "+p.store_name+"\nالحي: "+(p.store_neighborhood||"—")+"\nالسعر: "+(p.price==null?"—":p.price+" ر.ي.")+"\nالفئة: "+(p.category||"—")+"\n"+(p.description||"");node(card,"div","details",data);var a=node(card,"div","actions","");var yes=node(a,"button","primary","موافقة ونشر"),no=node(a,"button","danger","رفض");yes.onclick=function(){review(x.id,"approve","");};no.onclick=function(){var r=prompt("سبب الرفض (اختياري):","");if(r!==null)review(x.id,"reject",r);};});if(!items.length)node($("queue"),"p","muted","لا توجد طلبات معلقة.");}async function load(){say("جارٍ التحميل…");try{var d=await call("/api/v1/admin/submissions?status=PENDING&limit=100");show(d.items||[]);$("panel").classList.remove("hidden");say("اتصال الإدارة جاهز.");}catch(e){say("تعذر التحميل: "+e.message);}}async function review(id,decision,reason){say("جارٍ حفظ القرار…");try{await call("/api/v1/admin/submissions/"+encodeURIComponent(id)+"/review",{method:"POST",body:JSON.stringify({decision:decision,reason:reason})});say("تم حفظ القرار.");await load();}catch(e){say("فشلت المراجعة: "+e.message);}}$("connect").onclick=function(){key=$("key").value.trim();if(key.length<32){say("أدخل المفتاح الصحيح.");return;}load();};$("refresh").onclick=load;$("key").onkeydown=function(e){if(e.key==="Enter")$("connect").click();};})();
</script></body></html>
